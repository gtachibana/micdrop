name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MicDrop.xcodeproj \
            -scheme MicDrop \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|isolated)|BUILD (SUCCEEDED|FAILED)" || true
          # Xcode creates the .app folder before compiling, so its existence alone proves nothing.
          grep -q "BUILD SUCCEEDED" build.log
          test -d build/Build/Products/Release-iphoneos/MicDrop.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MicDrop.app Payload/
          zip -qry MicDrop.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MicDrop-ipa
          path: MicDrop.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
